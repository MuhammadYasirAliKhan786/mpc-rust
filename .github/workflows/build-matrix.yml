name: MPC-Rust Cross-Platform CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: mpc-ui-win32.exe
            framework: Win32 / Direct3D 11
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: mpc-ui-macos
            framework: Cocoa AppKit / Metal
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin_name: mpc-ui-linux
            framework: GTK4 / Libadwaita / Wayland

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libva-dev libvulkan-dev ffmpeg libasound2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run Test Suite
        run: cargo test --workspace
